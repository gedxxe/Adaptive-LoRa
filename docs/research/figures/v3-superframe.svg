<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="338" viewBox="0 0 1050 338" role="img" aria-labelledby="title detail">
  <title id="title">Multi-client v3 superframe and cumulative bitmap</title>
  <desc id="detail">The gateway sends a beacon, listens for per-client length requests, then sends a grant. Four assigned DATA slots precede the aggregate bitmap. With positions 0 and 2 accepted, positions 1 and 3 are the only clients authorized for the next retry. A guarded feedback window follows every round.</desc>
  <rect width="1050" height="338" fill="#f8fafc" rx="14"/>
  <g font-family="system-ui,sans-serif" fill="#172238">
    <text x="28" y="38" font-size="23" font-weight="700">Four clients on one half-duplex radio</text>
    <text x="28" y="62" font-size="13">Schedule positions 0–3. Time runs left to right. Slot widths are schematic.</text>
    <g stroke="#1e3a5f" stroke-width="1">
      <rect x="28" y="88" width="92" height="51" fill="#dbeafe" rx="5"/>
      <rect x="128" y="88" width="156" height="51" fill="#ecfdf5" rx="5"/>
      <rect x="292" y="88" width="93" height="51" fill="#dbeafe" rx="5"/>
      <rect x="393" y="88" width="202" height="51" fill="#ecfdf5" rx="5"/>
      <rect x="603" y="88" width="109" height="51" fill="#dbeafe" rx="5"/>
      <rect x="720" y="88" width="165" height="51" fill="#fef3c7" rx="5"/>
      <rect x="893" y="88" width="129" height="51" fill="#dbeafe" rx="5"/>
    </g>
    <g text-anchor="middle" font-size="13">
      <text x="74" y="109" font-weight="700">Beacon</text><text x="74" y="126">GW → group</text>
      <text x="206" y="109" font-weight="700">Length requests</text><text x="206" y="126">0 · 1 · 2 · 3</text>
      <text x="338" y="109" font-weight="700">Slot grant</text><text x="338" y="126">GW → group</text>
      <text x="494" y="109" font-weight="700">Primary DATA slots</text><text x="494" y="126">0 · 1 · 2 · 3</text>
      <text x="657" y="109" font-weight="700">ACK₀ + grants</text><text x="657" y="126">GW → group</text>
      <text x="802" y="109" font-weight="700">Retry DATA slots</text><text x="802" y="126">1 · 3</text>
      <text x="957" y="109" font-weight="700">ACK₁</text><text x="957" y="126">Later rounds follow</text>
    </g>
    <path d="M120 152v8m0-4h8m0-4v8M385 152v8m0-4h8m0-4v8" stroke="#36526e" fill="none"/>
    <text x="28" y="181" font-size="13">Service anchors follow Beacon and Slot Grant completion. The calendar adds a provisional 50 ms guard.</text>
    <text x="28" y="213" font-size="15" font-weight="700">Round 0 feedback</text>
    <g font-size="14" text-anchor="middle">
      <text x="230" y="214">Index 0</text><text x="318" y="214">Index 1</text><text x="406" y="214">Index 2</text><text x="494" y="214">Index 3</text>
      <g fill="#d1fae5"><rect x="193" y="222" width="74" height="29" rx="4"/><rect x="369" y="222" width="74" height="29" rx="4"/></g>
      <g fill="#fde68a"><rect x="281" y="262" width="74" height="29" rx="4"/><rect x="457" y="262" width="74" height="29" rx="4"/></g>
      <text x="230" y="242">1</text><text x="318" y="242">0</text><text x="406" y="242">1</text><text x="494" y="242">0</text>
      <text x="230" y="282">0</text><text x="318" y="282">1</text><text x="406" y="282">0</text><text x="494" y="282">1</text>
    </g>
    <text x="28" y="242" font-size="14">Accepted 0x05</text><text x="28" y="282" font-size="14">Retry mask 0x0A</text>
    <g font-size="14">
      <text x="576" y="239">Positive bits carry the accepted client boot IDs.</text>
      <text x="576" y="262">Only granted positions may send in the next round.</text>
      <text x="576" y="285">A missed ACK leaves that client silent for the round.</text>
    </g>
    <text x="28" y="317" font-size="12" fill="#45566e">Bit 0 is the least significant bit. The final ACK contains no retry grants.</text>
  </g>
</svg>
