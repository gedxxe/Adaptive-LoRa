<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 352" role="img" aria-labelledby="title description">
  <title id="title">One radio, many clients</title>
  <desc id="description">The gateway walks through registered IDs. Each frame serves one group with control, DATA, a retry pool, and feedback. An expensive requested data profile can shorten the next group without skipping any ID.</desc>
  <rect x="1" y="1" width="918" height="350" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#15283c">
    <text x="34" y="50" font-size="30" font-weight="700">One radio, many clients</text>
    <text x="35" y="80" font-size="18" fill="#475569">The Gateway advances the registry cursor after each scheduled group.</text>
    <g font-size="19" font-weight="650" text-anchor="middle">
      <rect x="35" y="107" width="242" height="58" rx="9" fill="#dbeafe"/>
      <text x="156" y="142">Group 1</text>
      <rect x="314" y="107" width="178" height="58" rx="9" fill="#dcfce7"/>
      <text x="403" y="142">Group 2</text>
      <rect x="529" y="107" width="138" height="58" rx="9" fill="#e2e8f0"/>
      <text x="598" y="142">···</text>
      <rect x="704" y="107" width="181" height="58" rx="9" fill="#dbeafe"/>
      <text x="794" y="142">Last group</text>
    </g>
    <path d="M285 136h20m-7-6 7 6-7 6m202-6h20m-7-6 7 6-7 6m155-6h20m-7-6 7 6-7 6"
          fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M403 168v35M35 203h850" fill="none" stroke="#64748b" stroke-width="2"/>
    <g font-size="16" text-anchor="middle">
      <rect x="35" y="221" width="281" height="55" rx="7" fill="#e0e7ff"/>
      <text x="175" y="254">Beacon · Requests · Grant</text>
      <rect x="326" y="221" width="179" height="55" rx="7" fill="#dbeafe"/>
      <text x="415" y="254">Scheduled DATA</text>
      <rect x="515" y="221" width="269" height="55" rx="7" fill="#dcfce7"/>
      <text x="650" y="254">ACK · shared retries</text>
      <rect x="794" y="221" width="91" height="55" rx="7" fill="#e2e8f0"/>
      <text x="839" y="254">Tail</text>
    </g>
    <text x="35" y="315" font-size="17" fill="#475569">Higher DATA SF consumes more of the frame, so the active group may be smaller.</text>
  </g>
</svg>
