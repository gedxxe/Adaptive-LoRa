<title id="title">Why payload bands change a slot budget</title>
<desc id="desc">Project illustration based on TS-VP-LoRa, Figs. 1–2 (§3.2).. Inputs Payload length class Spreading factor. Airtime budget Longer packets occupy more time at fixed PHY.. Slot budget Budget packet and guards. Drift sets guard needs.. Our adaptation Serialize on one SX1262. Measure setup and drift.. The paper groups several logical planes. Our candidate schedules one radio operation at a time.</desc>
