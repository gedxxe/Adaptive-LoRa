<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">What a beacon needs to convey</title>
<desc id="desc">Project illustration based on TS-VP-LoRa, Fig. 3 and §§3.1–3.3.. Publish Announce superframe identity and scheduling context.. Resolve Combine the announcement with the assigned index.. Transmit Use the matching slot after acquiring timing.. Adaptive-LoRa proposes a versioned schedule with a lease and relative offsets. Its wire format is separate.</desc>
<rect width="960" height="260" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="18" y="37" fill="#182a3a" font-size="27" font-weight="700">What a beacon needs to convey</text>
<text x="18" y="63" fill="#42566a" font-size="15" font-weight="400">Project illustration based on TS-VP-LoRa, Fig. 3 and §§3.1–3.3.</text>
<rect x="16.0" y="88" width="288.0" height="115" rx="6" fill="#daeaf3" stroke="#9aafbd"/>
<text x="29.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Publish</text>
<text x="29.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Announce superframe identity</text>
<text x="29.0" y="161" fill="#182a3a" font-size="14" font-weight="400">and scheduling context.</text>
<path d="M 310.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="336.0" y="88" width="288.0" height="115" rx="6" fill="#dcedea" stroke="#9aafbd"/>
<text x="349.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Resolve</text>
<text x="349.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Combine the announcement</text>
<text x="349.0" y="161" fill="#182a3a" font-size="14" font-weight="400">with the assigned index.</text>
<path d="M 630.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="656.0" y="88" width="288.0" height="115" rx="6" fill="#e5e8f3" stroke="#9aafbd"/>
<text x="669.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Transmit</text>
<text x="669.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Use the matching slot</text>
<text x="669.0" y="161" fill="#182a3a" font-size="14" font-weight="400">after acquiring timing.</text>
<text x="18" y="234" fill="#344e62" font-size="14" font-weight="400">Adaptive-LoRa proposes a versioned schedule with a lease and relative offsets. Its wire format is separate.</text>
</g>
</svg>
