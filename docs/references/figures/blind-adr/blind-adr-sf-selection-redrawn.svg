<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">Beacon RSSI as a profile input</title>
<desc id="desc">Project illustration based on Blind ADR, Figs. 5–6 (§4). No research data reproduced.. Paper input Local beacon RSSI.. Paper decision Check a sensitivity band. Select an uplink SF.. Project proposal Gateway checks rolling link evidence and margin.. Project commit Agree on a version and effective frame.. No distance thresholds transfer from the paper. The present firmware runs a fixed SF7 profile.</desc>
<rect width="960" height="260" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="18" y="37" fill="#182a3a" font-size="27" font-weight="700">Beacon RSSI as a profile input</text>
<text x="18" y="63" fill="#42566a" font-size="15" font-weight="400">Project illustration based on Blind ADR, Figs. 5–6 (§4). No research data reproduced.</text>
<rect x="16.0" y="88" width="208.0" height="115" rx="6" fill="#daeaf3" stroke="#9aafbd"/>
<text x="29.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Paper input</text>
<text x="29.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Local beacon RSSI.</text>
<path d="M 230.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="256.0" y="88" width="208.0" height="115" rx="6" fill="#dcedea" stroke="#9aafbd"/>
<text x="269.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Paper decision</text>
<text x="269.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Check a sensitivity band.</text>
<text x="269.0" y="161" fill="#182a3a" font-size="14" font-weight="400">Select an uplink SF.</text>
<path d="M 470.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="496.0" y="88" width="208.0" height="115" rx="6" fill="#e5e8f3" stroke="#9aafbd"/>
<text x="509.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Project proposal</text>
<text x="509.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Gateway checks rolling</text>
<text x="509.0" y="161" fill="#182a3a" font-size="14" font-weight="400">link evidence and margin.</text>
<path d="M 710.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="736.0" y="88" width="208.0" height="115" rx="6" fill="#f9edd6" stroke="#9aafbd"/>
<text x="749.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Project commit</text>
<text x="749.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Agree on a version and</text>
<text x="749.0" y="161" fill="#182a3a" font-size="14" font-weight="400">effective frame.</text>
<text x="18" y="234" fill="#344e62" font-size="14" font-weight="400">No distance thresholds transfer from the paper. The present firmware runs a fixed SF7 profile.</text>
</g>
</svg>
