<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">From geographic group to frame demand</title>
<desc id="desc">Project illustration based on ATS-LoRa, Fig. 6 and §III. No experimental data reproduced.. Locate Node and gateway coordinates.. Group Determine SF zone and channel partition.. Allocate Estimate slot demand for that group.. Size Account for slot airtime and the frame floor.. Adaptive-LoRa budgets time from a gateway-issued schedule. It does not infer airtime demand from location.</desc>
<rect width="960" height="260" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="18" y="37" fill="#182a3a" font-size="27" font-weight="700">From geographic group to frame demand</text>
<text x="18" y="63" fill="#42566a" font-size="15" font-weight="400">Project illustration based on ATS-LoRa, Fig. 6 and §III. No experimental data reproduced.</text>
<rect x="16.0" y="88" width="208.0" height="115" rx="6" fill="#daeaf3" stroke="#9aafbd"/>
<text x="29.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Locate</text>
<text x="29.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Node and gateway</text>
<text x="29.0" y="161" fill="#182a3a" font-size="14" font-weight="400">coordinates.</text>
<path d="M 230.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="256.0" y="88" width="208.0" height="115" rx="6" fill="#dcedea" stroke="#9aafbd"/>
<text x="269.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Group</text>
<text x="269.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Determine SF zone</text>
<text x="269.0" y="161" fill="#182a3a" font-size="14" font-weight="400">and channel partition.</text>
<path d="M 470.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="496.0" y="88" width="208.0" height="115" rx="6" fill="#e5e8f3" stroke="#9aafbd"/>
<text x="509.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Allocate</text>
<text x="509.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Estimate slot demand</text>
<text x="509.0" y="161" fill="#182a3a" font-size="14" font-weight="400">for that group.</text>
<path d="M 710.0 146 h 18 m -6 -5 l 6 5 -6 5" fill="none" stroke="#3e5e75" stroke-width="2"/>
<rect x="736.0" y="88" width="208.0" height="115" rx="6" fill="#f9edd6" stroke="#9aafbd"/>
<text x="749.0" y="115" fill="#182a3a" font-size="17" font-weight="700">Size</text>
<text x="749.0" y="140" fill="#182a3a" font-size="14" font-weight="400">Account for slot airtime</text>
<text x="749.0" y="161" fill="#182a3a" font-size="14" font-weight="400">and the frame floor.</text>
<text x="18" y="234" fill="#344e62" font-size="14" font-weight="400">Adaptive-LoRa budgets time from a gateway-issued schedule. It does not infer airtime demand from location.</text>
</g>
</svg>
