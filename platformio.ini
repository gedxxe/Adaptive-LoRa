[platformio]
description = Adaptive-LoRa independent single-radio P2P research firmware
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
upload_protocol = esptool
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.8.1
lib_ignore = Wire
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Opt in only after confirming the delivered board's OLED pins and power rail.
[env:heltec_wifi_lora_32_V3_oled]
extends = env:heltec_wifi_lora_32_V3
lib_ignore =
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D ADAPTIVE_LORA_OLED=1

[env:heltec_wifi_lora_32_V3_research]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D ADAPTIVE_LORA_SCHEDULED=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -I src
    -Wall
    -Wextra
    -Werror
    -I test/support/platform
    -D ADAPTIVE_LORA_NATIVE_TEST=1
    -D ADAPTIVE_LORA_OLED=1
    -D UNITY_SUPPORT_64
build_src_filter =
    -<*>
    +<common/protocol/>
    +<common/config/>
    +<app/provisioning_console.cpp>
    +<gateway/gateway_app.cpp>
    +<client/client_app.cpp>
    +<common/diagnostics/serial_logger.cpp>
    +<common/diagnostics/oled_status_display.cpp>
    +<common/radio/radio_driver.cpp>
    +<app/nvs_config_store.cpp>
    +<app/firmware_runtime.cpp>
    +<app/scheduled_link.cpp>
    +<common/radio/sx1262_hardware.cpp>
