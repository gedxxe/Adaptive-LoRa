[platformio]
description = Adaptive-LoRa independent single-radio P2P research firmware
default_envs = esp32c3_supermini

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.8.1
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -I src
    -Wall
    -Wextra
    -Werror
    -I test/support/platform
    -D ADAPTIVE_LORA_NATIVE_TEST=1
build_src_filter =
    -<*>
    +<common/protocol/>
    +<common/config/>
    +<app/provisioning_console.cpp>
    +<gateway/gateway_app.cpp>
    +<client/client_app.cpp>
    +<common/diagnostics/serial_logger.cpp>
    +<common/radio/radio_driver.cpp>
